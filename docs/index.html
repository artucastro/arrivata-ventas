<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrivata Sales — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="top-bar"></div>

<nav class="navbar navbar-expand-lg arrivata-navbar">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-3" href="index.html">
      <span class="logo-text-fallback" style="display:block">Arrivata</span>
      <span class="nav-divider">|</span>
      <span class="nav-subtitle">Sales</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <i class="bi bi-list"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
        <li class="nav-item"><a class="nav-link active" href="index.html"><i class="bi bi-grid me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="mapa.html"><i class="bi bi-geo-alt me-1"></i>Mapa</a></li>
      </ul>
      <div class="d-flex gap-2 align-items-center">
        <button id="btn-csv" class="btn btn-outline-secondary btn-sm"><i class="bi bi-download me-1"></i>CSV</button>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4">
  <div class="d-flex align-items-baseline gap-3 mb-4">
    <h1 class="page-title mb-0">Prospectos</h1>
    <span class="text-muted" style="font-size:.82rem">CABA &amp; AMBA</span>
    <span id="demo-tag" class="ms-auto text-muted" style="font-size:.72rem;letter-spacing:.04em"></span>
  </div>

  <div class="row g-3 mb-4" id="stats"></div>

  <div class="card border-0 filter-card mb-3">
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-3">
          <input type="text" id="f-search" class="form-control form-control-sm" placeholder="Buscar nombre, dirección, nota...">
        </div>
        <div class="col-6 col-md-2">
          <select id="f-zone" class="form-select form-select-sm"><option value="">Todas las zonas</option></select>
        </div>
        <div class="col-6 col-md-2">
          <select id="f-neigh" class="form-select form-select-sm"><option value="">Todos los barrios</option></select>
        </div>
        <div class="col-6 col-md-2">
          <select id="f-status" class="form-select form-select-sm"><option value="">Todos los estados</option></select>
        </div>
        <div class="col-6 col-md-2">
          <select id="f-score" class="form-select form-select-sm">
            <option value="">Cualquier score</option>
            <option value="8">Alta prioridad (8+)</option>
            <option value="5">Media o alta (5+)</option>
          </select>
        </div>
        <div class="col-6 col-md-1">
          <button id="f-clear" class="btn btn-outline-secondary btn-sm w-100"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 prospects-table">
          <thead>
            <tr>
              <th class="ps-4">Nombre</th><th>Tipo</th><th>Barrio</th>
              <th class="text-center">Score</th><th>Estado</th><th>Productos</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="card-footer py-2 px-4" style="background:var(--a-bg-2);border-top:1px solid var(--a-border);font-size:.75rem;color:var(--a-light-gray);letter-spacing:.04em">
        <span id="count"></span>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" id="detailBody"></div>
  </div>
</div>

<footer class="arrivata-footer mt-5">
  <div class="container-fluid px-4"><span id="footer-note">Arrivata Sales Tool &mdash; uso interno</span></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
