<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arrivata Sales — Mapa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    #map { height: calc(100vh - 70px); width: 100%; }
    .map-wrapper { position: relative; }
    .map-legend {
      position: absolute; bottom: 30px; right: 10px; z-index: 1000;
      background: #fff; padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.15); font-size: 13px;
    }
    .legend-dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; }
  </style>
</head>
<body>

<div class="top-bar"></div>
<nav class="navbar navbar-expand-lg arrivata-navbar">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-3" href="index.html">
      <span class="logo-text-fallback" style="display:block">Arrivata</span>
      <span class="nav-divider">|</span><span class="nav-subtitle">Sales</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><i class="bi bi-list"></i></button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-grid me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="mapa.html"><i class="bi bi-geo-alt me-1"></i>Mapa</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="map-wrapper">
  <div id="map"></div>
  <div class="map-legend">
    <div class="mb-1 fw-semibold">Prioridad</div>
    <div><span class="legend-dot" style="background:#22c55e"></span>Alta (8–10)</div>
    <div><span class="legend-dot" style="background:#f59e0b"></span>Media (5–7)</div>
    <div><span class="legend-dot" style="background:#ef4444"></span>Baja (1–4)</div>
    <div class="mt-2 text-muted" id="map-count"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>
</body>
</html>
