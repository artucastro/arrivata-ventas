# Render Blueprint — despliegue repetible con un clic.
# Ver DEPLOY.md para el paso a paso completo (crear cuenta, conectar el repo,
# cargar las variables de entorno marcadas `sync: false` desde el dashboard).
#
# Referencia: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: arrivata-sales-tool
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    # Render inyecta el puerto a usar en $PORT — gunicorn tiene que bindear ahí,
    # no a un puerto fijo (5001, el que usa app.py en dev, no aplica acá).
    #
    # NO alcanza con un solo worker: mientras está ocupado con una búsqueda
    # con IA (~100s), no puede aceptar NINGUNA otra conexión — ni el health
    # check HTTP que manda Render cada cierto tiempo (timeout de 5s propio de
    # Render, mecanismo aparte del --timeout de gunicorn de más abajo), ni un
    # segundo usuario (Emmanuel) navegando la app en simultáneo. Render
    # interpreta el health check fallido como instancia caída y reinicia el
    # contenedor — cortando la búsqueda en curso con un 502.
    #
    # Se resuelve con concurrencia real DENTRO del único worker
    # (--worker-class gthread --threads 4) en vez de sumar un segundo
    # worker/proceso completo (--workers 2). Elegido gthread en vez de
    # workers=2 porque:
    #   - Memoria: un worker de más duplica el proceso ENTERO (Flask +
    #     anthropic + gspread + google-auth + psycopg2, todo importado de
    #     nuevo) — medido en local, ~78-84 MB por proceso. Un thread de más
    #     dentro del mismo proceso comparte esos imports; solo suma su stack
    #     (chico) y lo que esa request puntual retiene en memoria (~5-6 MB
    #     medidos por búsqueda). 4 threads en 1 proceso ≈ mitad o menos que
    #     2 procesos completos.
    #   - Correcto sin cambios de código: database.py YA usa
    #     psycopg2.pool.ThreadedConnectionPool (pensado para esto, con
    #     maxconn=10 — de sobra para 4 threads) detrás de un
    #     threading.Lock() — la capa de datos ya es thread-safe, no hay
    #     nada que adaptar para pasar de 1 a N threads.
    #   - Con 4 threads (no 2) queda margen real: 1 búsqueda larga + el
    #     health check + un segundo usuario navegando, todo al mismo tiempo,
    #     sin turnarse.
    #
    # --timeout 120: el default de gunicorn es 30s — un worker "silencioso"
    # (sin heartbeat) más de ese tiempo se mata con SIGKILL, y el log de esa
    # muerte ("was sent SIGKILL! Perhaps out of memory?") es genérico: dice
    # lo mismo tanto si lo mató el timeout de gunicorn como si lo mató el OOM
    # killer del SO — no distingue. Una búsqueda con IA (web_search del lado
    # del servidor de Anthropic, con reintentos por `pause_turn`) puede
    # perfectamente tardar más de 30s — medido en local, una búsqueda de UN
    # barrio tardó ~100s real. 120s da margen; si una búsqueda de "todo AMBA"
    # (bastante más pesada) sigue muriendo o el health check sigue fallando,
    # subir este número.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 4 --timeout 120
    healthCheckPath: /login
    envVars:
      # ─── Secretos / config de producción — cargar a mano desde el dashboard
      # de Render (Settings → Environment). `sync: false` evita que Render
      # pida un valor default o lo commitee: queda en blanco hasta que el
      # usuario lo carga con sus propias credenciales. Ver DEPLOY.md.
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Opcionales — solo si se usa la sincronización con Google Sheets.
      # Sin esto, la app funciona igual (dashboard, mapa, IA, CRM) sin Sheets.
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: SHEETS_CSV_URL
        sync: false
      - key: SHEETS_SPREADSHEET_KEY
        sync: false
      - key: SHEETS_GID
        sync: false
      # ─── Config no-secreta, con valor fijo ──────────────────────────────
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.9"
